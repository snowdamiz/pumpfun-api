name: Dependency Update

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package/package-lock.json'

    - name: Update dependencies
      working-directory: ./package
      run: |
        npm update
        npm audit fix --audit-level moderate

    - name: Run tests
      working-directory: ./package
      run: |
        npm test
        npm run build
        npm run lint

    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet package/package.json package/package-lock.json; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'chore: update dependencies'
        body: |
          🤖 Automated dependency update

          This PR updates package dependencies to their latest versions.

          - Dependencies have been updated using `npm update`
          - Security vulnerabilities have been fixed where possible
          - All tests pass with the updated dependencies

          Please review the changes and ensure everything works as expected.
        branch: chore/update-dependencies
        delete-branch: true
        labels: |
          dependencies
          automated

    - name: Report no changes
      if: steps.changes.outputs.changed == 'false'
      run: |
        echo "✅ All dependencies are up to date"